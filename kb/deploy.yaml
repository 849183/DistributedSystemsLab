---
apiVersion: v1
kind: Namespace
metadata:
  name: shopapp

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
  namespace: shopapp
data:
  db_init.sql: |
    -- contenido de app/DB/db_init.sql
    CREATE TABLE public.item (
      id       serial     PRIMARY KEY,
      name     text       NOT NULL,
      quantity integer    NOT NULL
    );

    ALTER TABLE public.item OWNER TO "user";

    INSERT INTO public.item (name, quantity) VALUES ('Laptop', 15);
    INSERT INTO public.item (name, quantity) VALUES ('Keyboard', 45);
    INSERT INTO public.item (name, quantity) VALUES ('Mouse', 60);
    INSERT INTO public.item (name, quantity) VALUES ('Monitor', 20);
    INSERT INTO public.item (name, quantity) VALUES ('Desk Chair', 10);
    INSERT INTO public.item (name, quantity) VALUES ('Notebook', 100);
    INSERT INTO public.item (name, quantity) VALUES ('Pen', 200);
    INSERT INTO public.item (name, quantity) VALUES ('Pencil', 150);
    INSERT INTO public.item (name, quantity) VALUES ('USB Drive', 80);
    INSERT INTO public.item (name, quantity) VALUES ('External Hard Drive', 25);
    INSERT INTO public.item (name, quantity) VALUES ('Smartphone', 30);
    INSERT INTO public.item (name, quantity) VALUES ('Tablet', 22);
    INSERT INTO public.item (name, quantity) VALUES ('Webcam', 35);
    INSERT INTO public.item (name, quantity) VALUES ('Headphones', 40);
    INSERT INTO public.item (name, quantity) VALUES ('Charger', 70);
    INSERT INTO public.item (name, quantity) VALUES ('Projector', 5);
    INSERT INTO public.item (name, quantity) VALUES ('Whiteboard', 12);
    INSERT INTO public.item (name, quantity) VALUES ('Stapler', 90);
    INSERT INTO public.item (name, quantity) VALUES ('Paper Clips', 300);
    INSERT INTO public.item (name, quantity) VALUES ('Calculator', 18);

    COPY public.item (name, quantity) FROM stdin;
    \.
    -- DB script ..

---
# Headless Service para StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: shopapp
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# StatefulSet de PostgreSQL (1 réplica)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopapp
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      volumes:
          - name: init-sql
            configMap:
              name: db-init-script
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: "Welcome1."
            - name: POSTGRES_DB
              value: shopApp
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready","-U","user"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
# ClusterIP Service para acceso interno de PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopapp
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
# Deployment del backend (3 réplicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ds/shopapp-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: >-
                postgresql://user:Welcome1.@postgres.shopapp.svc.cluster.local:5432/shopApp

---
# Service interno para el backend
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shopapp
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
# Service Type=LoadBalancer para exponer el backend al exterior
apiVersion: v1
kind: Service
metadata:
  name: backend-lb
  namespace: shopapp
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
